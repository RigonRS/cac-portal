<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Sempre carrega a última versão do portal (evita cache antigo no celular) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Portal do Cliente — P&amp;R Despachante Bélico</title>
  <link rel="stylesheet" href="styles.css?v=1.39" />
  <link rel="icon" href="favicon.png" type="image/png" />
</head>
<body class="portal-body">

<!-- HEADER -->
<header class="portal-header">
  <div class="logo-area">
    <img src="logo-pr.png" alt="Logo" onerror="this.style.display='none'" />
    <span class="escritorio-nome">P&amp;R Despachante Bélico</span>
  </div>
  <div class="user-area">
    <span class="saudacao">Olá, <strong id="nome-cliente">...</strong></span>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </div>
</header>

<!-- CONTEÚDO -->
<main class="portal-main">

  <!-- MENU DE BOTÕES (aparece após login) -->
  <div id="portal-menu" class="portal-menu"></div>

  <!-- VISUALIZAÇÃO DA SEÇÃO SELECIONADA -->
  <div id="portal-view" style="display:none"></div>

</main>

<script src="portal.js?v=1.39"></script>
</body>
</html>
